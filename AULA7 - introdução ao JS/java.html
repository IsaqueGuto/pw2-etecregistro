<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercício Aula - 7</title>
  </head>
  <body>
    <h1>Exercício Aula - 7</h1>
    <p>Seus dados:</p>
  </body>
  <script>
    let nome = window.prompt("Digite seu nome: ");
    document.write("Seu nome é: " + nome);
    document.write("<br>");

    let ano = Number(window.prompt("Digite o seu ano de nascimento: "));
    let soma = 2026 - ano;
    document.write("Sua idade é: " + soma);
    document.write("<br>");

    let cidade = window.prompt("Digite sua cidade: ");
    document.write(`Você mora em: ${cidade.toUpperCase()}`);
    document.write("<br>");

    let salario = Number(window.prompt("DIgite o seu salário: "));
    let sald = salario * 0.19;
    document.write("Seu salário em dólares é: " + sald.toLocaleString('pt-br', {style: 'currency', currency: 'USD'}));
  </script>
</html>
